<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Mesnium Studio</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function () {
        try {
          if (window.__OPENCLAW_NATIVE_CONTROL_AUTH__) {
            window.__MESNIUM_AUTH__ = Object.assign({}, window.__OPENCLAW_NATIVE_CONTROL_AUTH__);
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.setAttribute("data-theme-mode", "dark");
      })();
    </script>
    <link rel="stylesheet" href="./brand/mesnium-theme.css" />
    <script type="module" src="./brand/mesnium-runtime.js"></script>
  </head>
  <body>
    <div id="mesnium-studio-app"></div>
  </body>
</html>
